[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathula-tv"
version = "0.1.3"
description = "Resumable South African news dubbing proof of concept"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "Pillow>=10", "python-dotenv>=1.0", "requests>=2.31", "yt-dlp"]

[project.optional-dependencies]
database = ["psycopg[binary,pool]>=3.2,<4"]
cloud = ["google-cloud-storage>=2.16"]
legacy-ai = ["openai>=1.40"]
diarization = ["pyannote.audio>=3.1", "torch>=2.1"]
speaker-recognition = ["speechbrain>=1.0,<2", "torch>=2.1", "torchaudio>=2.1", "huggingface_hub>=0.24", "safetensors>=0.8,<1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14"]
synthesis = ["numpy>=1.26", "soundfile>=0.12"]
# Optional/experimental fast path (see azure_tts_sdk.py): grouped bookmark synthesis
# via the Speech SDK instead of one REST call per speech island. Native platform
# wheel, kept out of core dependencies; azure_tts_sdk.py imports it lazily so the
# rest of the pipeline is unaffected when this extra isn't installed. Verify this
# pin's supported Python range against the deployment target before enabling.
speech-sdk = ["azure-cognitiveservices-speech>=1.40,<2"]
# Real, mechanical isiZulu morphological validity checking (Pretorius/Bosch's
# ZulMorph finite-state analyser) -- a genuine, non-LLM signal, distinct from every
# QA mechanism elsewhere in this file. foma-with-lib bundles a working Windows
# libfoma.dll (the plain "foma" PyPI package has none, and ctypes.util.find_library
# finds nothing on Windows without it) -- confirmed 2026-08-29 to load and analyse
# correctly on this platform. native_dub.py imports both lazily so the rest of the
# pipeline is unaffected when this extra isn't installed.
zulu-morphology = ["foma-with-lib>=1.0", "zulmorph>=1.0.5"]
# Standalone crawler (scripts/sync_madlanga_case.py, migrated from the sibling
# commission-ai project 2026-08-29) that builds working/case_state/master_case_state.json
# -- a compact "Story Memory" of the Madlanga Commission hearings, injected into
# native_dub.py's translation/QA context via master_case_context.py. Not imported by
# the core package; only needed to actually run the crawler.
case-sync = ["tqdm>=4.60", "pypdf>=4.0"]

[project.scripts]
mathula-tv = "mathula_tv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Autshumato English-isiZulu lexicon (see zulu_lexicon.py) and its licence.
# Quoted as a single literal key -- an unquoted "mathula_tv.data" is parsed by
# TOML as a nested table (mathula_tv -> data), not this literal dotted key,
# which newer setuptools rejects as "must be array" (confirmed on Python 3.14
# / setuptools's stricter pyproject.toml validation; older setuptools was
# lenient about the same malformed shape).
"mathula_tv.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: explicit paid/network/GPU integration test"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", ".venv", "working"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_site_packages = true
exclude = "(^|/)(build|working|\\.venv|tests)/|(^|/)src/mathula_tv/(omnivoice_adapter|omnivoice_worker)\\.py$"
