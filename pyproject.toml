[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathula-tv"
version = "0.1.3"
description = "Resumable South African news dubbing proof of concept"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21", "python-dotenv>=1.0", "requests>=2.31", "yt-dlp"]

[project.optional-dependencies]
database = ["psycopg[binary,pool]>=3.2,<4"]
cloud = ["google-cloud-storage>=2.16"]
legacy-ai = ["openai>=1.40"]
diarization = ["pyannote.audio>=3.1", "torch>=2.1"]
speaker-recognition = ["speechbrain>=1.0,<2", "torch>=2.1", "torchaudio>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.14"]
synthesis = ["numpy>=1.26", "soundfile>=0.12"]

[project.scripts]
mathula-tv = "mathula_tv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: explicit paid/network/GPU integration test"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", ".venv", "working"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_site_packages = true
exclude = "(^|/)(build|working|\\.venv|tests)/|(^|/)src/mathula_tv/(omnivoice_adapter|omnivoice_worker)\\.py$"
